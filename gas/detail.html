<!DOCTYPE html>

<html>
  <head>
    <base target="_top">
  </head>

  <body>
    <h1>TicketFlow</h1>


<h2>チケット詳細</h2>

<p>
  <a href="#" onclick="goBackToList(); return false;">
    ← チケット一覧に戻る
  </a>
</p>

<p>
  <a href="#" onclick="goToEdit(); return false;">
    チケットを編集
  </a>
</p>

<div id="ticketMessage">
  チケット情報を読み込んでいます...
</div>

<div id="ticketDetail" style="display: none;">
  <p>
    <strong>Ticket ID:</strong>
    <span id="ticketId"></span>
  </p>

  <p>
    <strong>Title:</strong>
    <span id="title"></span>
  </p>

  <p>
    <strong>Description:</strong>
    <span id="description"></span>
  </p>

  <p>
    <strong>Type:</strong>
    <span id="type"></span>
  </p>

  <p>
    <strong>Priority:</strong>
    <span id="priority"></span>
  </p>

  <p>
  <strong>Status:</strong>
  <span id="status"></span>
</p>

<p>
  <label for="statusSelect">Statusを変更:</label>
  <select id="statusSelect">
    <option value="Open">Open</option>
    <option value="In Progress">In Progress</option>
    <option value="Review">Review</option>
    <option value="Testing">Testing</option>
    <option value="Done">Done</option>
    <option value="Blocked">Blocked</option>
  </select>

  <button type="button" onclick="changeTicketStatus()">
    ステータスを変更
  </button>
</p>

<p id="statusMessage"></p>

  <p>
    <strong>Assignee ID:</strong>
    <span id="assigneeId"></span>
  </p>

  <p>
    <strong>Reporter ID:</strong>
    <span id="reporterId"></span>
  </p>

  <p>
    <strong>Reviewer ID:</strong>
    <span id="reviewerId"></span>
  </p>

  <p>
    <strong>Acceptance Criteria:</strong>
    <span id="acceptanceCriteria"></span>
  </p>

  <p>
    <strong>Due Date:</strong>
    <span id="dueDate"></span>
  </p>

  <p>
    <strong>GitHub Issue:</strong>
    <span id="githubIssue"></span>
  </p>

  <p>
    <strong>GitHub PR:</strong>
    <span id="githubPr"></span>
  </p>

  <p>
    <strong>Created At:</strong>
    <span id="createdAt"></span>
  </p>

  <p>
    <strong>Updated At:</strong>
    <span id="updatedAt"></span>
  </p>
</div>

<!-- コメント -->
<div id="commentSection">
  <h3>コメント</h3>

  <div id="commentMessage">
    コメントを読み込んでいます...
  </div>

  <div id="commentList"></div>

  <h4>コメントを追加</h4>

  <textarea
    id="commentText"
    rows="4"
    cols="50"
    placeholder="コメントを入力してください"
  ></textarea>

  <br>

  <button type="button" onclick="addNewComment()">
    コメントを追加
  </button>

  <p id="addCommentMessage"></p>
</div>

<script>
  // 一覧画面へ戻る
  function goBackToList() {
    google.script.run
      .withSuccessHandler(function(webAppUrl) {
        window.top.location.href = webAppUrl;
      })
      .withFailureHandler(function(error) {
        alert(`一覧画面への遷移に失敗しました: ${error.message}`);
      })
      .getWebAppUrl();
  }

    // 編集画面へ移動
  function goToEdit() {
    google.script.run
      .withSuccessHandler(function(webAppUrl) {
        const editUrl =
          `${webAppUrl}?page=edit&ticketId=${encodeURIComponent(ticketId)}`;

        window.top.location.href = editUrl;
      })
      .withFailureHandler(function(error) {
        alert(`編集画面への遷移に失敗しました: ${error.message}`);
      })
      .getWebAppUrl();
  }

  // コメント一覧を取得
  function loadComments() {
    document.getElementById('commentMessage').textContent =
      'コメントを読み込んでいます...';

    google.script.run
      .withSuccessHandler(function(comments) {
        const commentList =
          document.getElementById('commentList');

        commentList.innerHTML = '';

        if (comments.length === 0) {
          document.getElementById('commentMessage').textContent =
            'コメントはありません。';

          return;
        }

        document.getElementById('commentMessage').textContent = '';

        comments.forEach(function(comment) {
          const commentElement =
            document.createElement('div');

          commentElement.innerHTML = `
            <p>
              <strong>${comment['Author ID'] || ''}</strong>
              <span>
                (${comment['Created At'] || ''})
              </span>
            </p>
            <p>${comment['Comment'] || ''}</p>
            <hr>
          `;

          commentList.appendChild(commentElement);
        });
      })
      .withFailureHandler(function(error) {
        document.getElementById('commentMessage').textContent =
          `コメントの取得に失敗しました: ${error.message}`;
      })
      .getCommentsByTicketId(ticketId);
  }

  // コメントを追加
  function addNewComment() {
    const commentText =
      document.getElementById('commentText').value;

    document.getElementById('addCommentMessage').textContent =
      'コメントを追加しています...';

    google.script.run
      .withSuccessHandler(function(result) {
        document.getElementById('commentText').value = '';

        document.getElementById('addCommentMessage').textContent =
          'コメントを追加しました。';

        loadComments();
      })
      .withFailureHandler(function(error) {
        document.getElementById('addCommentMessage').textContent =
          `コメントの追加に失敗しました: ${error.message}`;
      })
      .addComment(ticketId, commentText);
  }

  // Statusを変更する
function changeTicketStatus() {
  const newStatus =
    document.getElementById('statusSelect').value;

  document.getElementById('statusMessage').textContent =
    'Statusを変更しています...';

  google.script.run
    .withSuccessHandler(function() {
      document.getElementById('status').textContent =
        newStatus;

      document.getElementById('statusSelect').value =
        newStatus;

      document.getElementById('statusMessage').textContent =
        'Statusを変更しました。';
    })
    .withFailureHandler(function(error) {
      document.getElementById('statusMessage').textContent =
        `Statusの変更に失敗しました: ${error.message}`;
    })
    .updateTicketStatus(ticketId, newStatus);
}

  // URLからTicket IDを取得
  const ticketId = '<?= ticketId ?>';

  if (!ticketId) {
    document.getElementById('ticketMessage').textContent =
      'Ticket IDが指定されていません。';
  } else {
    google.script.run
      .withSuccessHandler(function(ticket) {
        if (!ticket) {
          document.getElementById('ticketMessage').textContent =
            '指定されたチケットが見つかりません。';
          return;
        }

        document.getElementById('ticketMessage').style.display = 'none';
        document.getElementById('ticketDetail').style.display = 'block';

        document.getElementById('ticketId').textContent =
          ticket['Ticket ID'] || '';

        document.getElementById('title').textContent =
          ticket['Title'] || '';

        document.getElementById('description').textContent =
          ticket['Description'] || '';

        document.getElementById('type').textContent =
          ticket['Type'] || '';

        document.getElementById('priority').textContent =
          ticket['Priority'] || '';

        document.getElementById('status').textContent =
          ticket['Status'] || '';

        document.getElementById('assigneeId').textContent =
          ticket['Assignee ID'] || '';

        document.getElementById('reporterId').textContent =
          ticket['Reporter ID'] || '';

        document.getElementById('reviewerId').textContent =
          ticket['Reviewer ID'] || '';

        document.getElementById('acceptanceCriteria').textContent =
          ticket['Acceptance Criteria'] || '';

        document.getElementById('dueDate').textContent =
          ticket['Due Date'] || '';

        document.getElementById('githubIssue').textContent =
          ticket['GitHub Issue'] || '';

        document.getElementById('githubPr').textContent =
          ticket['GitHub PR'] || '';

        document.getElementById('createdAt').textContent =
          ticket['Created At'] || '';

        document.getElementById('updatedAt').textContent =
          ticket['Updated At'] || '';

        loadComments();
      })
      .withFailureHandler(function(error) {
        document.getElementById('ticketMessage').textContent =
          `チケット情報の取得に失敗しました: ${error.message}`;
      })
      .getTicketById(ticketId);
  }
</script>


  </body>
</html>
